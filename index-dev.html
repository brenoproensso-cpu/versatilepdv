<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Versatile — PDV [DEV]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ====== TOKENS ====== */
[data-theme="dark"]{
  --bg:#141019;--bg2:#1c1622;--bg3:#241d2b;--bg4:#2e2637;
  --border:#2a2334;--border2:#392f47;
  --text:#f6f1f8;--text2:#b4aac0;--text3:#79708a;
  --card-bg:#1a1420;--topbar-bg:#161019;--sidebar-bg:#100c15;
  --input-bg:#1e1826;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45);
  --shadow:0 10px 34px -10px rgba(0,0,0,.65);
  --shadow-lg:0 28px 64px -14px rgba(0,0,0,.72);
  --ring:rgba(192,80,104,.45);
  --green:#5cc08a;--greendim:#16382a;
  --red:#e5788a;--reddim:#3a1822;
  --amber:#e2ac57;--amberdim:#3a2b14;
  --blue:#74acea;--bluedim:#16273f;
  --gold:#ccac7c;--golddim:#33280f;
  --winedim:#331621;--winetext:#edb7c6;
}
[data-theme="light"]{
  --bg:#faf7f9;--bg2:#ffffff;--bg3:#f4eef2;--bg4:#ebe3e9;
  --border:#efe6ec;--border2:#ddd1db;
  --text:#221a28;--text2:#6a5f72;--text3:#a89eb1;
  --card-bg:#ffffff;--topbar-bg:#fffffff2;--sidebar-bg:#f7f2f6;
  --input-bg:#f6f1f5;
  --shadow-sm:0 1px 2px rgba(60,30,50,.06);
  --shadow:0 12px 34px -12px rgba(80,40,70,.18);
  --shadow-lg:0 26px 54px -16px rgba(80,40,70,.24);
  --ring:rgba(139,45,67,.30);
  --green:#2f9d63;--greendim:#e3f4ea;
  --red:#cd4459;--reddim:#fbe5e9;
  --amber:#b17b1f;--amberdim:#f6ecd7;
  --blue:#3070bf;--bluedim:#e6eefa;
  --gold:#9a7736;--golddim:#f2ebd8;
  --winedim:#f6e5ec;--winetext:#8b2d43;
}
:root{
  --wine:#8b2d43;--wine2:#a5384f;--wine3:#5c1a2a;
  --accent:#a5384f;--accent2:#c05068;--accentglow:#d76a82;
  --r:9px;--r2:14px;--r3:20px;
  --font-head:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .25s,color .25s}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text3);background-clip:padding-box}
::selection{background:var(--wine);color:#fff}
button{font-family:var(--font-body);cursor:pointer}
input,select,textarea{font-family:var(--font-body)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
.metric-val,.tot-big,.pc-price,td,.rank-tot,.ci-price{font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.hidden{display:none!important}
.flex{display:flex}.flex-col{flex-direction:column}
.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-end{justify-content:flex-end}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.w-full{width:100%}.flex-1{flex:1}
.text-xs{font-size:11px}.text-sm{font-size:12px}
.text-muted{color:var(--text2)}.text-dim{color:var(--text3)}
.font-bold{font-weight:700}.font-semi{font-weight:600}.font-med{font-weight:500}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.text-green{color:var(--green)}.text-red{color:var(--red)}
.text-amber{color:var(--amber)}.text-blue{color:var(--blue)}
.text-gold{color:var(--gold)}.text-wine{color:var(--accent2)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ====== APP LAYOUT ====== */
#app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:232px;min-width:232px;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:background .25s}
.sidebar-logo{padding:22px 18px 16px;display:flex;align-items:center;gap:12px}
.logo-v{width:34px;height:38px;flex-shrink:0}
.logo-text-block{}
.logo-name{font-family:var(--font-head);font-size:23px;font-weight:700;letter-spacing:4px;color:var(--text);line-height:1}
.logo-sub{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);margin-top:3px;font-weight:600}
.sidebar-user{margin:6px 12px 8px;padding:12px 14px;border-radius:var(--r2);background:var(--bg3);border:1px solid var(--border)}
.sidebar-user .u-name{font-weight:600;font-size:13px;color:var(--text)}
.sidebar-user .u-role{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-top:3px}
.nav-section{padding:14px 18px 5px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);font-weight:700}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;padding:9px 14px;margin:1px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--text2);transition:background .18s,color .18s;font-weight:500}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--winedim);color:var(--winetext);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent2)}
.nav-item .ni{font-size:15px;width:19px;text-align:center;flex-shrink:0}
.nav-item .drag-handle{font-size:11px!important;width:12px!important;opacity:.35;cursor:grab!important}
.nav-item:hover .drag-handle{opacity:.7}
.sidebar-bottom{margin-top:auto;padding:10px;border-top:1px solid var(--border);display:flex;gap:6px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:60px;background:var(--topbar-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:12px;transition:background .25s;backdrop-filter:saturate(1.4) blur(8px);position:sticky;top:0;z-index:50}
.topbar-title{font-family:var(--font-head);font-size:24px;font-weight:600;flex:1;letter-spacing:.3px;line-height:1}
.content{flex:1;overflow-y:auto;padding:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}

/* ====== CARDS ====== */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r2);padding:20px;box-shadow:var(--shadow-sm);transition:background .25s,border-color .2s}
.metric-card{position:relative;overflow:hidden;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r2);padding:18px 20px;box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.metric-card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--accent),var(--wine3));opacity:.55}
.metric-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border2)}
.metric-card .mi{font-size:22px;position:absolute;top:16px;right:16px;opacity:.28}
.metric-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:9px}
.metric-val{font-family:var(--font-head);font-size:30px;font-weight:700;line-height:1;letter-spacing:.5px}
.metric-sub{font-size:11px;color:var(--text3);margin-top:6px}

/* ====== BUTTONS ====== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:13px;font-weight:500;transition:background .16s,border-color .16s,transform .1s,box-shadow .16s;white-space:nowrap;cursor:pointer}
.btn:hover{background:var(--bg4);border-color:var(--text3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--wine2),var(--wine));border:1px solid var(--wine2);color:#fff;font-weight:600;box-shadow:0 2px 10px -3px rgba(139,45,67,.6)}
.btn.primary:hover{background:linear-gradient(180deg,var(--accent2),var(--wine2));box-shadow:0 4px 16px -4px rgba(165,56,79,.65)}
.btn.danger{background:var(--reddim);border-color:var(--red);color:var(--red)}
.btn.success{background:var(--greendim);border-color:var(--green);color:var(--green)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--bg3);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.xs{padding:3px 8px;font-size:11px}
.btn.whats{background:#0a4d2a;border-color:#1a7a40;color:#4ade80}
.btn.email{background:#071a36;border-color:#1a4a80;color:#60a5fa}

/* ====== FORMS ====== */
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;letter-spacing:.4px;text-transform:uppercase}
.form-control{width:100%;padding:10px 13px;border:1px solid var(--border2);border-radius:var(--r);background:var(--input-bg);color:var(--text);font-size:13px;outline:none;transition:border-color .16s,box-shadow .16s}
.form-control:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.form-control::placeholder{color:var(--text3)}
.form-label{color:var(--text3)}
select.form-control option{background:var(--bg2)}
.form-row{display:grid;gap:10px}
.form-row.col2{grid-template-columns:1fr 1fr}
.form-row.col3{grid-template-columns:1fr 1fr 1fr}

/* ====== TABLE ====== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:10px 14px;text-align:left;font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text3);font-weight:700;border-bottom:1px solid var(--border)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .14s}
tbody tr:hover td{background:var(--bg3)}
.td-name{font-weight:600}

/* ====== BADGES ====== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.3px;border:1px solid transparent}
.badge.green{background:var(--greendim);color:var(--green);border-color:color-mix(in srgb,var(--green) 34%,transparent)}
.badge.red{background:var(--reddim);color:var(--red);border-color:color-mix(in srgb,var(--red) 34%,transparent)}
.badge.amber{background:var(--amberdim);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 34%,transparent)}
.badge.blue{background:var(--bluedim);color:var(--blue);border-color:color-mix(in srgb,var(--blue) 34%,transparent)}
.badge.wine{background:var(--winedim);color:var(--winetext);border-color:color-mix(in srgb,var(--wine2) 34%,transparent)}
.badge.gold{background:var(--golddim);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 34%,transparent)}
.badge.gray{background:var(--bg4);color:var(--text2);border-color:var(--border2)}
.badge.admin{background:linear-gradient(135deg,var(--wine3),var(--wine2));color:#fff;border:none}

/* ====== MODAL ====== */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,6,14,.6);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(7px);padding:16px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r3);padding:24px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn .22s cubic-bezier(.2,.7,.3,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-lg{max-width:760px}
.modal-sm{max-width:440px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-title{font-family:var(--font-head);font-size:19px;font-weight:600;letter-spacing:.3px}
.modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:2px 6px;line-height:1;border-radius:var(--r)}
.modal-close:hover{color:var(--text);background:var(--bg3)}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.modal-section{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-weight:600;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}

/* ====== NOTIFICATIONS ====== */
#nc{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.notif{padding:11px 15px;border-radius:var(--r);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;max-width:320px;animation:nIn .25s ease}
.notif.ok{background:var(--greendim);border:1px solid var(--green);color:var(--green)}
.notif.err{background:var(--reddim);border:1px solid var(--red);color:var(--red)}
.notif.warn{background:var(--amberdim);border:1px solid var(--amber);color:var(--amber)}
.notif.info{background:var(--bluedim);border:1px solid var(--blue);color:var(--blue)}
@keyframes nIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes nOut{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}

/* ====== LOGIN ====== */
#login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:500}
.login-box{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r3);padding:44px 38px;width:410px;max-width:92vw;box-shadow:var(--shadow-lg)}
.login-logo-area{text-align:center;margin-bottom:30px}
.login-logo-v{margin:0 auto 10px}
.login-logo-name{font-family:var(--font-head);font-size:34px;font-weight:700;letter-spacing:6px;color:var(--text);line-height:1}
.login-logo-tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);margin-top:5px;font-weight:600}

/* ====== VENDA ====== */
.venda-layout{display:grid;grid-template-columns:1fr 380px;gap:14px;height:calc(100vh - 130px);overflow:hidden}
.venda-left{overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.venda-right{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r2);display:flex;flex-direction:column;overflow:hidden}
.cart-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-family:var(--font-head);font-weight:600;font-size:15px}
.cart-body{flex:1;overflow-y:auto;padding:8px}
.cart-item{display:flex;align-items:center;gap:10px;padding:9px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:5px;transition:border .15s}
.cart-item:hover{border-color:var(--border2)}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:600;font-size:13px}
.ci-sub{font-size:11px;color:var(--text3)}
.ci-price{font-weight:700;color:var(--gold);white-space:nowrap;font-size:13px}
.qty-ctrl{display:flex;align-items:center;gap:3px}
.qty-btn{width:22px;height:22px;border:1px solid var(--border2);border-radius:6px;background:var(--bg4);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.qty-btn:hover{background:var(--bg);border-color:var(--accent)}
.qty-n{min-width:26px;text-align:center;font-weight:700;font-size:13px}
.cart-ft{padding:12px 16px;border-top:1px solid var(--border);background:var(--bg3)}
.tot-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;color:var(--text2)}
.tot-big{font-family:var(--font-head);font-size:27px;font-weight:700;color:var(--text);display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:8px;border-top:1px solid var(--border);letter-spacing:.5px}
.troco-box{margin-top:8px;padding:10px 12px;background:var(--greendim);border:1px solid var(--green);border-radius:var(--r)}

/* ====== PRODUTOS GRID ====== */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.prod-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:13px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s;position:relative}
.prod-card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:var(--shadow)}
.prod-card:active{transform:translateY(0)}
.pc-name{font-weight:700;font-size:14px;margin-bottom:3px}
.pc-sub{font-size:13px;color:var(--text2);margin-bottom:8px;font-weight:600}
.pc-price{font-size:16px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.pc-stk{position:absolute;top:7px;right:7px}

/* ====== SEARCH ====== */
.srch{position:relative}
.srch input{padding-left:34px}
.srch-ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}

/* ====== RANK ====== */
.rank-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rank-n{width:20px;text-align:center;font-size:11px;font-weight:700;color:var(--text3)}
.rank-bar-w{flex:1}
.rank-bar-bg{background:var(--bg4);border-radius:20px;height:5px;overflow:hidden}
.rank-bar-f{height:5px;border-radius:20px;background:linear-gradient(90deg,var(--wine),var(--accent2))}
.rank-lbl{font-size:12px;font-weight:600;margin-bottom:2px}
.rank-tot{font-size:12px;font-weight:700;color:var(--gold);min-width:55px;text-align:right}

/* ====== GRADE ====== */
.grade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px;margin-top:8px}
.grade-item{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px;text-align:center}
.grade-item label{display:block;font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.grade-item input{width:100%;text-align:center;padding:4px 5px;font-size:13px;font-weight:700;border:1px solid var(--border2);border-radius:5px;background:var(--bg4);color:var(--text);outline:none}
.grade-item input:focus{border-color:var(--accent)}

/* ====== MARKUP HELPER ====== */
.markup-hint{background:var(--winedim);border:1px solid var(--wine3);border-radius:var(--r);padding:8px 12px;margin-top:6px;font-size:12px;color:var(--winetext)}
.markup-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.markup-chip{padding:3px 10px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;font-size:12px;cursor:pointer;color:var(--text2);transition:all .12s}
.markup-chip:hover{border-color:var(--accent);color:var(--text)}
.markup-chip.active{background:var(--wine);border-color:var(--wine2);color:#fff}

/* ====== TABS ====== */
.tab-row{display:flex;gap:3px;background:var(--bg3);border-radius:var(--r2);padding:4px;border:1px solid var(--border);margin-bottom:16px}
.tab-btn{flex:1;padding:8px 12px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:background .16s,color .16s,box-shadow .16s;white-space:nowrap;text-align:center}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--card-bg);color:var(--text);box-shadow:var(--shadow-sm)}

/* ====== THEME TOGGLE ====== */
.theme-btn{width:34px;height:34px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.theme-btn:hover{background:var(--bg4);color:var(--text)}

/* ====== SPARKLINE ====== */
.sparkline{display:flex;align-items:flex-end;gap:3px;height:40px}
.spk{flex:1;background:var(--wine);opacity:.6;border-radius:2px 2px 0 0;min-height:2px;transition:opacity .15s}
.spk:hover{opacity:1}

/* ====== SECTION TITLE ====== */
.sec-title{font-family:var(--font-head);font-size:19px;font-weight:600;letter-spacing:.3px;margin-bottom:14px;display:flex;align-items:center;gap:9px;text-wrap:balance}

/* ====== SEP ====== */
.sep{height:1px;background:var(--border);margin:12px 0}

/* ====== EMPTY STATE ====== */
.empty{text-align:center;padding:48px 36px;color:var(--text3)}
.empty .ei{font-size:34px;margin-bottom:10px;opacity:.3}

/* ====== RECIBO PRINT ====== */
@media print{
  @page{margin:0;padding:0}
  html,body{margin:0;padding:0;background:#fff}
  body *{visibility:hidden}
  #rp,#rp *{visibility:visible}
  #rp{
    position:fixed;top:0;left:0;
    width:var(--print-width,72mm);
    display:block!important;
    padding:var(--print-padding,3mm);
    margin:0;background:#fff
  }
  .modal-backdrop,.modal,.tbar,.sidebar,
  .modal-header,.modal-footer,.recibo-editor-side.left,
  #recibo-preview-live{display:none!important}
  .recibo-preview-wrap{box-shadow:none!important}
}
#rp{display:none}
.ri{font-family:'Courier New',monospace;font-size:12px;width:72mm;margin:0 auto;background:#fff;color:#000;padding:2mm 3mm}
.ri .rl{text-align:center;font-family:serif;font-size:19px;font-weight:900;letter-spacing:4px;margin-bottom:1px}
.ri .rs{text-align:center;font-size:10px;letter-spacing:1px}
.ri .rd{border-bottom:1px dashed #000;margin:7px 0}
.ri .rr{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.ri .rit{font-size:11px;padding:1px 0}
.ri .rtot{font-weight:900;font-size:15px;border-top:2px solid #000;padding-top:5px;margin-top:3px}
.ri .rc{text-align:center;font-size:11px}
.ri .rtroco{font-weight:900;font-size:13px}

/* EDITOR DE RECIBO */
.recibo-editor-layout{display:grid;grid-template-columns:1fr 1fr;gap:0;height:100%}
.recibo-editor-side{display:flex;flex-direction:column}
.recibo-editor-side.left{border-right:1px solid var(--border);background:var(--bg2)}
.recibo-editor-side.right{background:#e8e8e8}
.editor-section{padding:10px 14px;border-bottom:1px solid var(--border)}
.editor-section-title{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:8px}
.editor-field{margin-bottom:8px}
.editor-field label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500}
.editor-field input,.editor-field textarea{width:100%;padding:6px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg3);color:var(--text);font-size:12px;outline:none;font-family:var(--font-body);resize:vertical}
.editor-field input:focus,.editor-field textarea:focus{border-color:var(--accent)}
.editor-scroll{flex:1;overflow-y:auto;padding:14px}
.recibo-preview-wrap{background:#fff;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.2);display:inline-block;min-width:100%}
.item-editor-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:6px 8px;background:var(--bg3);border-radius:6px;border:1px solid var(--border)}
.item-editor-row input{padding:4px 6px;border:1px solid var(--border2);border-radius:5px;background:var(--bg4);color:var(--text);font-size:12px;outline:none}
.item-editor-row input:focus{border-color:var(--accent)}

/* ====== CAIXA FECHAMENTO ====== */
.fechamento-box{background:var(--winedim);border:1px solid var(--wine3);border-radius:var(--r2);padding:16px}

/* ====== ÍCONES ====== */
.ico{width:18px;height:18px;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;flex-shrink:0}
/* ====== HAMBURGER ====== */
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px 6px;line-height:1;border-radius:var(--r)}
.hamburger:hover{background:var(--bg3)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;backdrop-filter:blur(2px)}

/* ====== RESPONSIVE ====== */
@media(max-width:900px){
  .venda-layout{grid-template-columns:1fr;height:auto}
  .grid4,.grid5{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .hamburger{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);transition:transform .25s ease;width:260px;min-width:260px;box-shadow:4px 0 24px rgba(0,0,0,.4)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.open{display:block}
  .sidebar .logo-text-block,.sidebar-user,.nav-item span,.nav-section{display:revert}
  .topbar{padding:0 12px}
  .topbar-title{font-size:16px}
  .content{padding:12px 10px}
  .grid4,.grid5{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .metric-card{padding:12px}
  .metric-val{font-size:22px}
  .metric-card .mi{font-size:20px;top:10px;right:10px;opacity:.35}
  .card{padding:12px}
  .login-box{width:92vw;max-width:400px;padding:28px 20px}
  .modal{margin:8px;padding:16px;max-height:95vh}
  .form-row.col2,.form-row.col3{grid-template-columns:1fr}
  .tab-row{overflow-x:auto;flex-wrap:nowrap}
  .tab-btn{flex:none;min-width:auto;padding:7px 12px}
  table{font-size:12px}
  thead th,tbody td{padding:7px 8px}
  .venda-layout{grid-template-columns:1fr;height:auto;overflow:visible}
  .venda-right{max-height:60vh}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .sec-title{font-size:14px}
  .btn{padding:7px 10px;font-size:12px}
  .topbar .flex{flex-wrap:wrap}
  .nav-item{padding:11px 14px;font-size:14px}
  .nav-item .drag-handle{display:none}
  #nc{top:8px;right:8px;left:8px}
  .notif{max-width:100%}
  .h-exp-content{padding:10px 10px 12px 10px}
  .qty-btn{width:28px;height:28px;font-size:16px}
}
@media(max-width:400px){
  .grid4,.grid5,.grid3,.grid2{grid-template-columns:1fr}
  .metric-val{font-size:20px}
  .topbar-title{font-size:15px}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
/* ===== Histórico: accordion de itens ===== */

tr.h-data-row.open{border-bottom:none}

.h-exp-sub{font-size:11px;color:var(--text3);margin-top:1px}
.h-exp-preco{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap;margin-left:8px}
.h-btn-exp{background:none;border:none;color:var(--text3);cursor:pointer;font-size:13px;padding:3px 5px;border-radius:4px;transition:color .2s,transform .25s ease;line-height:1;display:inline-block}
.h-btn-exp:hover{color:var(--gold)}

async function sbGet(t,f,o,s){
  s=s||'*';f=f||'';o=o||'';
  let u=SB_URL+'/rest/v1/'+t+'?select='+s;
  if(f)u+='&'+f;if(o)u+='&order='+o;

  if(!r.ok){const e=await r.text();throw new Error('GET '+t+' ['+r.status+']: '+e.slice(0,120));}
  return r.json();
}
async function sbPost(t,b){

function calcLiquido(total,pgto,bandeira,parcelas){
  if(!total||pgto==='Dinheiro'||pgto==='Boleto'||pgto==='Transferência'||pgto==='Cheque'||pgto==='Voucher')
    return {liquido:total,taxa:0,desconto:0,parcelas:1};
  if(pgto==='PIX') return {liquido:total,taxa:0,desconto:0,parcelas:1};
  if(pgto==='Débito'){
    const b=bandeira==='elo'?TAXAS.debito.elo:TAXAS.debito.visa_master;
    const d=total*b.taxa; return {liquido:total-d,taxa:b.taxa*100,desconto:d,parcelas:1};
  }
  if(pgto==='Crédito'){
    const b=bandeira==='elo_amex'?TAXAS.credito.elo_amex:TAXAS.credito.visa_master;
    const p=parcelas||1; const t=b.parcelas.find(x=>x.x===p)||b.parcelas[0];
    const d=total*t.taxa; return {liquido:total-d,taxa:t.taxa*100,desconto:d,parcelas:p};
  }
  if(pgto==='Link de Pagamento'){
    const b=bandeira==='elo_amex'?TAXAS.link.elo_amex:TAXAS.link.visa_master;
    const p=parcelas||1; const t=b.parcelas.find(x=>x.x===p)||b.parcelas[0];
    const d=total*t.taxa; return {liquido:total-d,taxa:t.taxa*100,desconto:d,parcelas:p};
  }
  return {liquido:total,taxa:0,desconto:0,parcelas:1};
}

function _parseDt(iso){
  if(!iso)return null;
  // Se for só data (YYYY-MM-DD), trata como horário local para evitar shift de fuso
  if(/^\d{4}-\d{2}-\d{2}$/.test(iso)){
    const [y,m,d]=iso.split('-');
    return new Date(parseInt(y),parseInt(m)-1,parseInt(d));
  }
  return new Date(iso);
}
const fmtD=iso=>{

  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Araguaina'});
};

async function doLogin(){
  const u=document.getElementById('lu').value.trim().toLowerCase();
  const p=document.getElementById('lp').value;
  const err=document.getElementById('lerr');
  const btn=document.querySelector('#login-screen .btn.primary');
  err.classList.add('hidden');
  if(!u||!p){err.textContent='Preencha usuario e senha';err.style.color='var(--red)';err.classList.remove('hidden');return;}
  if(btn){btn.textContent='Entrando...';btn.disabled=true;}
  try{
    showLoading(true,'Verificando acesso...');
    const r=await fetch(SB_URL+'/rest/v1/rpc/fn_login',{method:'POST',headers:sbH(),body:JSON.stringify({p_username:u,p_senha:p})});
    showLoading(false);
    if(!r.ok) throw new Error('Falha na conexão (HTTP '+r.status+')');
    const res=await r.json();
    if(!res.ok){err.textContent='Usuário ou senha incorretos';err.style.color='var(--red)';err.classList.remove('hidden');if(btn){btn.textContent='Entrar';btn.disabled=false;}return;}
    const user=res.usuario;
    ses={usuario:{id:user.id,nome:user.nome,username:user.username,role:user.role,ativo:user.ativo,criado:user.criado,permissoes:user.permissoes||null}};
    await loadAll();
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('sb-name').textContent=ses.usuario.nome;
    document.getElementById('sb-role').textContent=ses.usuario.role==='admin'?'Administrador':'Vendedor';
    registrarAudit('LOGIN','Acesso ao sistema');
    carregarAuditoria();
    buildNav();goTo('dashboard');
  }catch(e){
    showLoading(false);console.error('LOGIN:',e);
    err.textContent='Erro: '+e.message;err.style.color='var(--red)';err.classList.remove('hidden');
  }
  if(btn){btn.textContent='Entrar';btn.disabled=false;}
}

}

function getNavOrder(){
  try{const o=localStorage.getItem('nav_order');if(o)return JSON.parse(o);}catch(e){}
  return NAV.map(n=>n.id);
}
function saveNavOrder(ids){try{localStorage.setItem('nav_order',JSON.stringify(ids));}catch(e){}}
function buildNav(){
  const order=getNavOrder();
  const navSorted=[...NAV].sort((a,b)=>{const ia=order.indexOf(a.id),ib=order.indexOf(b.id);return(ia<0?999:ia)-(ib<0?999:ib);});
  const snav=document.getElementById('snav');
  snav.innerHTML=navSorted.filter(n=>temPerm(n.id)).map(n=>`
    <div class="nav-item" id="ni-${n.id}" draggable="true"
      onclick="goTo('${n.id}')"
      ondragstart="navDragStart(event,'${n.id}')"
      ondragover="navDragOver(event)"
      ondrop="navDrop(event,'${n.id}')"
      ondragend="navDragEnd(event)"
    >
      <span class="ni drag-handle" title="Arrastar para reordenar" style="cursor:grab;opacity:.45;font-size:11px;margin-right:2px">⠿</span>
      <span class="ni">${icon(n.ic)}</span><span>${n.lb}</span>
    </div>`).join('');
}
let _navDragId=null;
function navDragStart(e,id){_navDragId=id;e.currentTarget.style.opacity='.4';}
function navDragOver(e){e.preventDefault();e.currentTarget.style.background='var(--bg3)';}
function navDrop(e,targetId){
  e.preventDefault();
  if(!_navDragId||_navDragId===targetId)return;
  const order=getNavOrder();
  const from=order.indexOf(_navDragId),to=order.indexOf(targetId);
  if(from<0||to<0)return;
  order.splice(from,1);order.splice(to,0,_navDragId);
  saveNavOrder(order);buildNav();
  if(curPage){
    const ni=document.getElementById('ni-'+curPage);if(ni)ni.classList.add('active');
  }
}
function navDragEnd(e){_navDragId=null;document.querySelectorAll('.nav-item').forEach(el=>{el.style.opacity='';el.style.background='';});}

function rankProds(periodo){
  let vs=db.vendas;
  if(periodo==='mes')vs=vs.filter(v=>v.data&&v.data.startsWith(thisMonth()));
  if(periodo==='hoje')vs=vs.filter(v=>v.data&&v.data.startsWith(today()));
  const m={};
  vs.forEach(v=>(v.itens||[]).forEach(i=>{
    if(!m[i.id])m[i.id]={id:i.id,nome:i.nome,marca:i.marca||'',qtd:0,val:0,qtdAtual:(db.produtos.find(x=>x.id===i.id)?.qtd||0)};
    m[i.id].qtd+=i.qtd||1;m[i.id].val+=(i.preco||0)*(i.qtd||1);
  }));
  const arr=Object.values(m).sort((a,b)=>b.qtd-a.qtd);
  const mx=arr[0]?.qtd||1;
  return arr.map(r=>({...r,pct:Math.round((r.qtd/mx)*100)}));
}

function filterEstoque(q){
  const admin=isAdmin();
  const colSpan=admin?10:7;
  const fil=db.produtos.filter(p=>!q||[p.nome,p.marca,p.cod,p.cor,p.obs].join(' ').toLowerCase().includes(q.toLowerCase()));
  const tbody=document.getElementById('estoque-tbody');
  if(!tbody)return;
  tbody.innerHTML=fil.map(p=>{
    const tot=p.grade?p.grade.reduce((s,g)=>s+g.q,0):(p.qtd||0);
    const st=tot===0?'red':tot<=(p.min||2)?'amber':'green';
    const lab=tot===0?'Esgotado':tot<=(p.min||2)?'Baixo':'OK';
    const margem=p.custo&&p.preco?Math.round(((p.preco-p.custo)/p.preco)*100):null;
    const grStr=p.grade?p.grade.map(g=>g.n+'('+g.q+')').join(' '):(p.tam||'—');
    const grVisual = p.grade && p.grade.length
      ? p.grade.map(g=>{
          const cor = g.q===0?'red':g.q<=1?'amber':'green';
          if(!temPerm('estoque')){
            return '<span class="badge '+cor+'" style="margin:1px;font-size:11px">'+g.n+'('+g.q+')</span>';
          }
          return '<span style="display:inline-flex;align-items:center;gap:2px;margin:1px;border:1px solid var(--border);border-radius:4px;padding:1px 2px;background:var(--bg3)">'+
            '<button class="btn xs" style="padding:0 4px;min-width:18px" onclick="event.stopPropagation();gradeRapida(\''+p.id+'\','+g.n+',-1)">-</button>'+
            '<span class="badge '+cor+'" id="gq-'+p.id+'-'+g.n+'" style="font-size:11px;min-width:34px;text-align:center">'+g.n+'('+g.q+')</span>'+
            '<button class="btn xs" style="padding:0 4px;min-width:18px" onclick="event.stopPropagation();gradeRapida(\''+p.id+'\','+g.n+',1)">+</button>'+
            '</span>';
        }).join('')
      : (p.tam||'—');
    const tdAdmin=admin?'<td class="text-dim">'+(p.custo?fmt(p.custo):'—')+'</td><td>'+(margem!==null?'<span class="badge '+(margem>=30?'green':margem>=15?'amber':'red')+'">'+margem+'%</span>':'—')+'</td>':'';
    const canEdit=temPerm('estoque');const tdAcoes=canEdit?('<td><div class="flex gap-2"><button class="btn xs" onclick="verHistoricoEstoque(&apos;'+p.id+'&apos;)">📋</button><button class="btn xs" onclick="abrirAjusteEstoque(&apos;'+p.id+'&apos;)">±</button><button class="btn xs" onclick="openProdModal(&apos;'+p.id+'&apos;)">✏️</button>'+( isAdmin()?'<button class="btn xs danger" onclick="delProd(&apos;'+p.id+'&apos;)">🗑</button>':'' )+'</div></td>'):'<td></td>';
    const fotoHtml=p.foto?'<img src="'+p.foto+'" style="width:36px;height:36px;object-fit:cover;border-radius:6px;flex-shrink:0">':'<div style="width:36px;height:36px;background:var(--bg4);border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">👟</div>';
    return'<tr>'+
      '<td class="text-xs text-dim">'+(p.cod||'—')+'</td>'+
      '<td><div style="display:flex;align-items:center;gap:8px">'+fotoHtml+'<div><div class="td-name">'+p.nome+'</div><div style="font-size:11px;color:var(--text3)">'+(p.obs||'')+'</div></div></div></td>'+
      '<td>'+(p.marca||'—')+(p.cor?' · '+p.cor:'')+'</td>'+
      '<td style="font-size:12px;color:var(--text2)"><div style="display:flex;flex-wrap:wrap;gap:1px;max-width:280px">'+grVisual+'</div></td>'+
      tdAdmin+
      '<td class="font-bold text-gold">'+fmt(p.preco)+'</td>'+
      '<td class="font-bold" id="gtot-'+p.id+'">'+tot+'</td>'+
      '<td><span class="badge '+st+'">'+lab+'</span></td>'+
      tdAcoes+
      '</tr>';
  }).join('')||(function(){return'<tr><td colspan="'+colSpan+'"><div class="empty"><div class="ei">📦</div><p>Nenhum produto</p></div></td></tr>';}());
}

function calcMarkup(){
  const custo=parseFloat(document.getElementById('pcusto')?.value)||0;
  const preco=parseFloat(document.getElementById('ppreco')?.value)||0;
  const el=document.getElementById('markup-area');if(!el)return;
  if(!custo){el.innerHTML='';return;}
  const margem=preco?Math.round(((preco-custo)/preco)*100):0;
  const sug50=+(custo*1.5).toFixed(2);
  const sug80=+(custo*1.8).toFixed(2);
  const sug100=+(custo*2.0).toFixed(2);
  el.innerHTML=`<div class="markup-hint">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span><b>Margem atual:</b> <span style="color:${margem>=30?'var(--green)':margem>=15?'var(--amber)':'var(--red)'}">${preco?margem+'%':'—'}</span></span>
      <span class="text-xs text-dim">Sugestões de preço:</span>
    </div>
    <div class="markup-row mt-2">
      <span class="markup-chip" onclick="document.getElementById('ppreco').value=${sug50};calcMarkup()">50% — ${fmt(sug50)}</span>
      <span class="markup-chip" onclick="document.getElementById('ppreco').value=${sug80};calcMarkup()">80% — ${fmt(sug80)}</span>
      <span class="markup-chip" onclick="document.getElementById('ppreco').value=${sug100};calcMarkup()">100% — ${fmt(sug100)}</span>
    </div>
  </div>`;
}
function mudarGrade(tipo){
  const cont=document.getElementById('grade-cont');if(!cont)return;
  if(tipo==='Tamanho Único'){
    cont.innerHTML=`<div class="form-row col2 mt-2"><div class="form-group"><label class="form-label">Número</label><input class="form-control" type="number" id="g-unum" placeholder="37" oninput="updGTot()"></div><div class="form-group"><label class="form-label">Quantidade</label><input class="form-control" type="number" id="g-uqtd" value="1" min="0" oninput="updGTot()"></div></div>`;
    updGTot();return;
  }
  if(tipo==='Personalizado'){
    cont.innerHTML=`<div class="flex gap-2 mt-2 mb-2 items-center">
      <input class="form-control" type="number" id="g-an" placeholder="Nº" style="width:75px">
      <input class="form-control" type="number" id="g-aq" placeholder="Qtd" style="width:75px" value="1">
      <button class="btn sm" onclick="addGItem()">+ Adicionar</button>
    </div>
    <div id="gclist" class="grade-grid"></div>`;
    gpCustom=[];renderGradeCustom();return;
  }
  const g=GRADES[tipo]||[];
  cont.innerHTML=`<div class="grade-grid">${g.map(item=>`
    <div class="grade-item"><label>Nº ${item.n}</label>
      <input type="number" class="gqi" data-num="${item.n}" value="${item.q}" min="0" oninput="updGTot()">
    </div>`).join('')}</div>`;
  updGTot();
}
function addGItem(){
  const n=parseInt(document.getElementById('g-an').value);
  const q=parseInt(document.getElementById('g-aq').value)||1;
  if(!n){notify('Informe o número','warn');return;}
  if(gpCustom.find(x=>x.n===n)){notify('Número já adicionado','warn');return;}
  gpCustom.push({n,q});gpCustom.sort((a,b)=>a.n-b.n);
  document.getElementById('g-an').value='';renderGradeCustom();updGTot();
}
function renderGradeCustom(){
  const el=document.getElementById('gclist');if(!el)return;
  el.innerHTML=gpCustom.map((g,i)=>`<div class="grade-item"><label>Nº ${g.n} <span onclick="gpCustom.splice(${i},1);renderGradeCustom();updGTot()" style="color:var(--red);cursor:pointer">×</span></label><input type="number" class="gqc" data-idx="${i}" value="${g.q}" min="0" oninput="gpCustom[${i}].q=parseInt(this.value)||0;updGTot()"></div>`).join('');
}
function updGTot(){
  const el=document.getElementById('grade-tot');if(!el)return;
  const g=coletarGrade();
  const tot=g.reduce((s,x)=>s+x.q,0);
  el.textContent=tot?`Total: ${tot} pares`:'';
}
function coletarGrade(){
  const tipo=document.getElementById('pgt')?.value||'Personalizado';
  if(tipo==='Tamanho Único'){const n=parseInt(document.getElementById('g-unum')?.value)||0;const q=parseInt(document.getElementById('g-uqtd')?.value)||0;return n?[{n,q}]:[];}
  if(tipo==='Personalizado')return gpCustom.map(g=>({n:g.n,q:g.q})).filter(g=>g.q>0);
  return Array.from(document.querySelectorAll('.gqi')).map(inp=>({n:parseInt(inp.dataset.num),q:parseInt(inp.value)||0})).filter(g=>g.q>0);
}
function openProdModal(id){
  if(!temPerm('estoque')){notify('Sem permissão para editar produtos','err');return;}
  window._fotoB64=null;
  editId=id||null;const p=id?db.produtos.find(x=>x.id===id):null;
  // Não re-renderiza a página — garante que o modal existe no DOM
  if(!document.getElementById('mprod')){pgEstoque();}
  setTimeout(()=>{
    document.getElementById('mpt').textContent=p?'Editar Produto':'Novo Produto';
    if(p){
      ['c','n','m','cor','custo','preco','obs'].forEach(f=>{const el=document.getElementById('p'+f);if(el)el.value=p[{c:'cod',n:'nome',m:'marca',cor:'cor',custo:'custo',preco:'preco',obs:'obs'}[f]]||'';});
      document.getElementById('pmin').value=p.min||2;
      if(p.grade&&p.grade.length){document.getElementById('pgt').value='Personalizado';mudarGrade('Personalizado');setTimeout(()=>{gpCustom=[...p.grade];renderGradeCustom();updGTot();},20);}
      window._fotoB64=null;
      const fprev=document.getElementById('foto-preview');
      if(fprev)fprev.innerHTML=p.foto?'<img src="'+p.foto+'" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">':'';
      calcMarkup();
    } else { mudarGrade('Personalizado'); }
    openM('mprod');
  },30);
}
async function salvarProd(){
  if(!temPerm('estoque')){notify('Sem permissão para salvar produtos','err');return;}
  const nome=document.getElementById('pn').value.trim();
  const preco=parseFloat(document.getElementById('ppreco').value)||0;
  if(!nome){notify('Informe o nome','warn');return;}
  if(!preco){notify('Informe o preço de venda','warn');return;}
  const grade=coletarGrade();
  const fotoExist=(editId?db.produtos.find(x=>x.id===editId)?.foto:null)||null;
  const obj={id:editId||null,cod:document.getElementById('pc').value.trim(),nome,marca:document.getElementById('pm').value.trim(),cor:document.getElementById('pcor').value.trim(),custo:parseFloat(document.getElementById('pcusto').value)||0,preco,min:parseInt(document.getElementById('pmin').value)||2,obs:document.getElementById('pobs').value.trim(),foto:window._fotoB64||fotoExist,grade,qtd:grade.reduce((s,g)=>s+g.q,0),tam:grade.map(g=>g.n).join('/')};
  try{
    await saveProduto(obj);
        closeM('mprod');pgEstoque();notify(editId?'Produto atualizado!':'Produto cadastrado!');
  }catch(e){notify('Erro ao salvar: '+e.message,'err');}
}
async function delProd(id){
  if(!confirm('Excluir produto?'))return;
  try{await deleteProduto(id);pgEstoque();notify('Excluído','warn');}
  catch(e){notify('Erro: '+e.message,'err');}
}

    else if((p.qtd||0)>0)cards.push({id:p.id,ck:p.id,nome:p.nome,marca:p.marca,tam:p.tam,cor:p.cor,preco:p.preco,disp:p.qtd||0,hasGrade:false});

  const el=document.getElementById('pcards');if(!el)return;
  el.innerHTML=fil.map(c=>`<div class="prod-card" onclick="addCart('${c.id}',${c.hasGrade?c.tam:0})">

    <div class="pc-sub">${c.tam?'<strong style="font-size:15px;color:var(--text)">Nº '+c.tam+'</strong>':''}${c.cor?' · '+c.cor:''}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
      <div class="pc-price">${fmt(c.preco)}</div>
      ${c.marca?'<span style="font-size:10px;color:var(--text3)">'+c.marca+'</span>':''}
    </div>
  </div>`).join('')||'<div class="empty w-full" style="grid-column:1/-1"><div class="ei">📦</div><p>Nenhum produto disponível</p></div>';
}

function addCart(pid,tam){
  const p=db.produtos.find(x=>x.id===pid);if(!p)return;
  const ck=tam?`${pid}__${tam}`:pid;

  if(p.grade&&tam){const g=p.grade.find(x=>x.n===tam);disp=g?g.q:0;}else disp=p.qtd||0;
  if(ci){if(ci.qtd>=disp){notify('Estoque insuficiente','warn');return;}ci.qtd++;}
  else cart.push({ck,id:pid,nome:p.nome,marca:p.marca,tam:tam||p.tam,cor:p.cor,preco:p.preco,qtd:1});

function chgQty(i,d){
  const ci=cart[i];const p=db.produtos.find(x=>x.id===ci.id);
  let disp;
  if(p&&p.grade&&ci.tam){const g=p.grade.find(x=>x.n===ci.tam);disp=g?g.q:0;}else disp=p?p.qtd||0:99;
  ci.qtd+=d;
  if(ci.qtd<=0)cart.splice(i,1);else if(ci.qtd>disp){ci.qtd=disp;notify('Estoque máximo','warn');}
  renderCart();
}

function calcTot(){
  const sub=cart.reduce((s,i)=>s+i.preco*i.qtd,0);
  const descVal=parseFloat(document.getElementById('vdesc')?.value)||0;
  const descTipo=document.querySelector('input[name="descTipo"]:checked')?.value||'R$';
  const cupomDesc=window._cupomDesc||0;
  const descBase = descTipo==='%' ? sub*(descVal/100) : descVal;
  const desc = Math.max(0, descBase + cupomDesc);
  const tot=Math.max(0,sub-desc);
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};
  set('tsub',fmt(sub));set('tdesc','- '+fmt(desc));set('tfinal',fmt(tot));
  // Calcular líquido da maquininha (suporta pagamento dividido)
  const pgto=document.getElementById('vpgto')?.value||'Dinheiro';
  const band=document.getElementById('v-bandeira')?.value||'visa_master';
  const parc=parseInt(document.getElementById('v-parcelas')?.value||'1');
  const usePgto2 = document.getElementById('usar-pgto2')?.checked;
  const pgto2 = document.getElementById('vpgto2')?.value||'';
  const val2 = usePgto2 ? (parseFloat(document.getElementById('vpgto2val')?.value)||0) : 0;
  const val1 = usePgto2 ? Math.max(0, tot - val2) : tot;
  const res1 = calcLiquido(val1, pgto, band, parc);
  const res2 = usePgto2 ? calcLiquido(val2, pgto2, 'visa_master', 1) : {liquido:0,taxa:0,desconto:0,parcelas:1};
  const res = {
    liquido: res1.liquido + res2.liquido,
    taxa: res1.taxa,
    desconto: res1.desconto + res2.desconto,
    parcelas: parc
  };
  const liqEl=document.getElementById('vliquido');
  if(liqEl){
    if(pgto!=='Dinheiro'&&pgto!=='Boleto'&&tot>0){
      const parcelaTxt=res.parcelas>1?' ('+res.parcelas+'x de '+fmt(tot/res.parcelas)+')':'';
      liqEl.style.display='block';
      liqEl.innerHTML=
        '<div style="margin-top:8px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r)">'+
        '<div style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:6px">Simulação Maquininha</div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:3px 0">'+
          '<span>Valor cobrado do cliente</span><span>'+fmt(tot)+parcelaTxt+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--red);padding:3px 0">'+
          '<span>Taxa maquininha ('+res.taxa.toFixed(2)+'%)</span><span>- '+fmt(res.desconto)+'</span></div>'+
        '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--green);padding:6px 0;border-top:1px solid var(--border);margin-top:4px">'+
          '<span>Você recebe líquido</span><span>'+fmt(res.liquido)+'</span></div>'+
        '</div>';
    } else {
      liqEl.style.display='none';liqEl.innerHTML='';
    }
  }
  calcTroco();
}

function calcTroco(){
  const desc=parseFloat(document.getElementById('vdesc')?.value)||0;
  const sub=cart.reduce((s,i)=>s+i.preco*i.qtd,0);
  const tot=Math.max(0,sub-desc);
  const receb=parseFloat(document.getElementById('vrec')?.value)||0;
  const el=document.getElementById('vtrocobox');if(!el)return;
  if(document.getElementById('vpgto')?.value!=='Dinheiro'){el.innerHTML='';return;}
  if(!receb){el.innerHTML='';return;}
  const troco=receb-tot;
  const ok=troco>=0;
  el.innerHTML=`<div class="troco-box" style="${ok?'':'background:var(--reddim);border-color:var(--red)'}">
    <div class="text-xs" style="color:${ok?'var(--green)':'var(--red)'};font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">${ok?'Troco':'Valor Insuficiente'}</div>
    <div style="font-family:var(--font-head);font-size:26px;font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${ok?fmt(troco):fmt(tot-receb)+' faltando'}</div>
  </div>`;
}
async function finalizarVenda(){
  if(!cart.length){notify('Carrinho vazio','warn');return;}
  // Venda retroativa (admin) — data antiga e opção de não alterar estoque
  const retroAtiva = isAdmin() && document.getElementById('usar-retroativa')?.checked;
  let retroDataISO = null, retroDataYMD = null, retroNaoEstoque = false;
  if(retroAtiva){
    const inp = document.getElementById('vretro-data')?.value;
    if(!inp){notify('Informe a data da venda retroativa','warn');return;}
    retroDataISO = new Date(inp).toISOString();
    retroDataYMD = inp.slice(0,10);
    retroNaoEstoque = document.getElementById('vretro-naoestoque')?.checked!==false;
  }
  const desc=parseFloat(document.getElementById('vdesc')?.value)||0;
  const sub=cart.reduce((s,i)=>s+i.preco*i.qtd,0);
  const tot=Math.max(0,sub-desc);
  const pgto=document.getElementById('vpgto')?.value||'Dinheiro';
  const modal=document.getElementById('v-modal')?.value||'Presencial';
  const recebido=pgto==='Dinheiro'?(parseFloat(document.getElementById('vrec')?.value)||0):tot;
  const band=document.getElementById('v-bandeira')?.value||null;
  const parc=parseInt(document.getElementById('v-parcelas')?.value||'1');
  const usePgto2=document.getElementById('usar-pgto2')?.checked;
  const pgto2=usePgto2?(document.getElementById('vpgto2')?.value||''):'';
  const val2=usePgto2?(parseFloat(document.getElementById('vpgto2val')?.value)||0):0;
  const pgtoLabel = usePgto2&&pgto2 ? pgto+' + '+pgto2 : pgto;
  const simul=calcLiquido(tot-(usePgto2?val2:0),pgto,band||'visa_master',parc);
  // Gerar ID baseado no MAIOR número existente — evita conflito com chave única
  const maxNum = db.vendas.reduce((max, v) => {
    const n = parseInt((v.id||'').replace('V',''))||0;
    return n > max ? n : max;
  }, 0);
  const nextNum = (maxNum + 1).toString().padStart(4,'0');
  const venda={
    id:'V'+nextNum,data:retroAtiva?retroDataISO:nowISO(),
    clienteId:vendaCliId||null,clienteNome:vendaCliNome||'',
    pgto:pgtoLabel,recebido,troco:Math.max(0,recebido-tot),
    modalidade:modal,
    bandeira:band||null,
    parcelas:parc,
    taxaMaquininha:simul.taxa,
    valorLiquido:simul.liquido,
    descontoMaquininha:simul.desconto,
    itens:JSON.parse(JSON.stringify(cart)),
    subtotal:sub,desconto:desc,total:tot,
    vendedor:ses.usuario.nome,vendedorId:ses.usuario.id
  };
  // atualizar estoque em memória e persistir cada produto alterado
  // (pulado se for venda retroativa marcada como "não baixar estoque")
  const produtosAlterar=[];
  if(!(retroAtiva&&retroNaoEstoque)){
    cart.forEach(ci=>{
      const p=db.produtos.find(x=>x.id===ci.id);if(!p)return;
      if(p.grade&&ci.tam){const g=p.grade.find(x=>x.n===ci.tam);if(g)g.q=Math.max(0,g.q-ci.qtd);}
      else p.qtd=Math.max(0,(p.qtd||0)-ci.qtd);
      p.qtd=p.grade?p.grade.reduce((s,g)=>s+g.q,0):p.qtd;
      if(!produtosAlterar.find(x=>x.id===p.id)) produtosAlterar.push(p);
    });
  }
  try{
    // salvar venda, movimento e produtos em paralelo
    const movObj={tipo:'entrada',desc:'Venda #'+venda.id+(venda.clienteNome?' — '+venda.clienteNome:'')+(retroAtiva?' (retroativa)':''),val:tot,data:retroAtiva?retroDataYMD:today(),vendaId:venda.id};
    await Promise.all([
      saveVenda(venda),
      ...produtosAlterar.map(p=>sbPatch('produtos',`id=eq.${p.id}`,{grade:p.grade,qtd:p.qtd}))
    ]);
  // Registrar movimentação de estoque por produto vendido (pulado se retroativa sem baixa)
  if(!(retroAtiva&&retroNaoEstoque)){
    venda.itens?.forEach(item=>{ if(!item.avulso) addMovEstoque(item.id,'VENDA',-item.qtd,'Venda '+venda.id,item.tam||null); });
  }
    await saveMovimento(movObj);
    cart=[];vendaCliId=null;vendaCliNome='';
    if(retroAtiva){
      const chk=document.getElementById('usar-retroativa');if(chk)chk.checked=false;
      const wrap=document.getElementById('retroativa-wrap');if(wrap)wrap.style.display='none';
    }
    registrarAudit('VENDA','Venda '+venda.id+' — '+fmt(venda.total)+' — '+venda.pgto,{itens:venda.itens?.length,cliente:venda.clienteNome});
    notify(retroAtiva?'Venda retroativa registrada com sucesso!':'Venda finalizada e salva!');
    currentReciboVenda=venda;
    exibirModalRecibo(venda);
    pgVenda();
  }catch(e){
    notify('Erro ao salvar venda: '+e.message,'err',5000);
    console.error('Venda error:',e);
  }
  showLoading(false);
}

let reciboEditado = {}; // campos personalizados por venda

function buildReciboData(v){
  const cli = v.clienteId ? db.clientes.find(x=>x.id===v.clienteId) : null;
  const ed  = reciboEditado[v.id] || {};
  return {
    nomeLoja:    ed.nomeLoja    ?? 'VERSATILE',
    subLoja:     ed.subLoja     ?? 'LOJA DE CALÇADOS',
    endereco:    ed.endereco    ?? 'Palmas — TO',
    cnpjTel:     ed.cnpjTel    ?? 'CNPJ: 00.000.000/0001-00 | (63) 0000-0000',
    vendaNum:    ed.vendaNum    ?? v.id,
    dataHora:    ed.dataHora    ?? fmtD(v.data),
    modalidade:  ed.modalidade  ?? (v.modalidade||'Presencial'),
    clienteNome: ed.clienteNome ?? (v.clienteNome||'Consumidor Final'),
    cpf:         ed.cpf         ?? (cli?.cpf||''),
    whatsapp:    ed.whatsapp    ?? (cli?.whatsapp||''),
    email:       ed.email       ?? (cli?.email||''),
    vendedor:    ed.vendedor    ?? (v.vendedor||''),
    itens:       ed.itens       ?? v.itens.map(i=>({
      desc: i.qtd+'x '+i.nome+(i.tam?' Nº'+i.tam:'')+(i.cor?' ('+i.cor+')':''),
      val:  fmt(i.preco*i.qtd)
    })),
    subtotal:    ed.subtotal    ?? fmt(v.subtotal),
    desconto:    ed.desconto    ?? (v.desconto ? '- '+fmt(v.desconto) : ''),
    total:       ed.total       ?? fmt(v.total),
    pgto:        ed.pgto        ?? v.pgto,
    recebido:    ed.recebido    ?? (v.pgto==='Dinheiro' ? fmt(v.recebido) : ''),
    troco:       ed.troco       ?? (v.pgto==='Dinheiro' ? fmt(v.troco) : ''),
    rodape1:     ed.rodape1     ?? 'Obrigado pela preferência!',
    rodape2:     ed.rodape2     ?? '— Versatile Loja —',
    obsExtra:    ed.obsExtra    ?? '',
  };
}

function atualizarPreviewRecibo(v){
  const ed = reciboEditado[v.id] || {};
  // coletar itens do editor
  const itensRows = document.querySelectorAll('.item-editor-row');
  if(itensRows.length){
    ed.itens = Array.from(itensRows).map(r=>({
      desc: r.querySelector('.ie-desc').value,
      val:  r.querySelector('.ie-val').value
    }));
  }
  // coletar campos texto
  const campos = ['nomeLoja','subLoja','endereco','cnpjTel','vendaNum','dataHora',
    'modalidade','clienteNome','cpf','whatsapp','email','vendedor',
    'subtotal','desconto','total','pgto','recebido','troco','rodape1','rodape2','obsExtra'];
  campos.forEach(c=>{
    const el = document.getElementById('re-'+c);
    if(el) ed[c] = el.value;
  });
  reciboEditado[v.id] = ed;
  const data = buildReciboData(v);
  // mesclar edições
  Object.assign(data, ed);
  if(ed.itens) data.itens = ed.itens;
  const preview = document.getElementById('recibo-preview-live');
  if(preview) preview.innerHTML = buildReciboHTML(v, data);
  // atualizar área de impressão
  document.getElementById('rp').innerHTML = buildReciboHTML(v, data);
}

let currentReciboVenda = null;

function _exibirModalReciboOrig(v){
  currentReciboVenda = v;
  exibirModalRecibo(v);
}

function fecharRecibo(){document.getElementById('mrecibo')?.remove();}

function imprimirRecibo(){
  aplicarCfgImpressao(); // Aplica largura, fonte e logo configurados
  if(currentReciboVenda){
    const ed = reciboEditado[currentReciboVenda.id]||{};
    const data = buildReciboData(currentReciboVenda);
    Object.assign(data,ed);
    if(ed.itens) data.itens=ed.itens;
    document.getElementById('rp').innerHTML = buildReciboHTML(currentReciboVenda,data);
  }
  fecharRecibo();
  setTimeout(()=>window.print(),150);
}

function adicionarItemRecibo(){
  const cont = document.getElementById('itens-editor');
  if(!cont) return;
  const idx = cont.querySelectorAll('.item-editor-row').length;
  const div = document.createElement('div');
  div.className = 'item-editor-row';
  div.innerHTML = `<input class="ie-desc flex-1" value="" placeholder="Descrição do item" oninput="atualizarPreviewRecibo(currentReciboVenda)">
    <input class="ie-val" style="width:80px;text-align:right" value="R$ 0,00" placeholder="Valor" oninput="atualizarPreviewRecibo(currentReciboVenda)">
    <button onclick="this.parentElement.remove();atualizarPreviewRecibo(currentReciboVenda)" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 3px">×</button>`;
  cont.appendChild(div);
  div.querySelector('.ie-desc').focus();
}

function removerItemRecibo(idx){
  const rows = document.querySelectorAll('.item-editor-row');
  if(rows[idx]) rows[idx].remove();
  atualizarPreviewRecibo(currentReciboVenda);
}

function resetarRecibo(vendaId){
  if(!confirm('Restaurar o recibo original? As edições serão perdidas.')) return;
  delete reciboEditado[vendaId];
  fecharRecibo();
  const v = currentReciboVenda;
  setTimeout(()=>{ currentReciboVenda=v; exibirModalRecibo(v); },50);
}

function imprimirReciboById(id){
  const v=db.vendas.find(x=>x.id===id);
  if(!v){notify('Venda não encontrada','err');return;}
  currentReciboVenda=v;
  // Fechar modal anterior se aberto
  document.getElementById('mrecibo')?.remove();
  const data=buildReciboData(v);
  document.getElementById('rp').innerHTML=buildReciboHTML(v,data);
  exibirModalRecibo(v);
}
function enviarEmail(vendaId){
  const v=db.vendas.find(x=>x.id===vendaId);
  const cli=v?.clienteId?db.clientes.find(x=>x.id===v.clienteId):null;
  const data=buildReciboData(v);
  const ed=reciboEditado[vendaId]||{};
  Object.assign(data,ed);
  const emailDest=ed.email||cli?.email||'';
  if(!emailDest){notify('Cliente sem e-mail cadastrado','warn');return;}
  const itensTexto=(data.itens||[]).map(i=>`${i.desc} — ${i.val}`).join('\n');
  const assunto=encodeURIComponent('Recibo de Compra #'+data.vendaNum+' — '+data.nomeLoja);
  const corpo=encodeURIComponent('Olá '+data.clienteNome+'!\n\nSegue seu recibo de compra:\n\nVenda Nº: '+data.vendaNum+'\nData: '+data.dataHora+'\nTotal: '+data.total+'\nPagamento: '+data.pgto+'\n\n'+itensTexto+(data.obsExtra?'\n\n'+data.obsExtra:'')+'\n\nObrigado pela preferência!\n'+data.nomeLoja+' — '+data.endereco);
  window.open('mailto:'+emailDest+'?subject='+assunto+'&body='+corpo,'_blank');
  notify('Abrindo cliente de e-mail...','info');
}
function enviarWhatsApp(vendaId){
  const v=db.vendas.find(x=>x.id===vendaId);
  const cli=v?.clienteId?db.clientes.find(x=>x.id===v.clienteId):null;
  const data=buildReciboData(v);
  const ed=reciboEditado[vendaId]||{};
  Object.assign(data,ed);
  const waDest=(ed.whatsapp||cli?.whatsapp||'').replace(/\D/g,'');
  if(!waDest){notify('Cliente sem WhatsApp cadastrado','warn');return;}
  const itensTexto=(data.itens||[]).map(i=>`${i.desc} — ${i.val}`).join('\n');
  const msg=encodeURIComponent('Olá '+data.clienteNome+'! 👠\n\n*Recibo de Compra #'+data.vendaNum+'*\nData: '+data.dataHora+'\n\n*Itens:*\n'+itensTexto+'\n\nTotal: *'+data.total+'*\nPagamento: '+data.pgto+(data.obsExtra?'\n\n'+data.obsExtra:'')+'\n\nObrigado pela preferência! 🌹\n*'+data.nomeLoja+' — '+data.endereco+'*');
  window.open('https://wa.me/55'+waDest+'?text='+msg,'_blank');
  notify('Abrindo WhatsApp...','info');
}

      <td><button class="h-btn-exp" id="hbtn-${v.id}" onclick="togHist('${v.id}')" aria-label="Expandir itens">&#9658;</button></td>

      <td class="text-dim text-xs">${v.vendedor||'—'}</td>
      <td><span class="badge ${v.modalidade==='Online'?'blue':'gray'}">${v.modalidade||'Presencial'}</span></td>
      <td><span class="badge wine">${v.pgto}</span></td>
      <td class="text-red">${v.desconto?fmt(v.desconto):'—'}</td>

async function excluirVenda(id){
  if(!isAdmin()&&!temPerm('cancelar_venda')){notify('Você não tem permissão para cancelar vendas','err');return;}
  const v=db.vendas.find(x=>x.id===id);
  if(!v){notify('Venda não encontrada','err');return;}

  // Montar lista de itens que serão devolvidos
  const itensStr=(v.itens||[]).map(i=>i.qtd+'x '+i.nome+(i.tam?' Nº'+i.tam:'')).join(', ');
  const conf=confirm(
    '⚠️ CANCELAR VENDA '+id+'?\n\n'+
    'Cliente: '+(v.clienteNome||'Consumidor Final')+'\n'+
    'Total: '+fmt(v.total)+'\n'+
    'Pagamento: '+v.pgto+'\n\n'+
    'Itens que retornam ao estoque:\n'+itensStr+'\n\n'+
    'Esta ação:\n'+
    '✓ Devolve os produtos ao estoque\n'+
    '✓ Remove a venda do faturamento\n'+
    '✓ Remove o lançamento financeiro\n\n'+
    'Confirmar cancelamento?'
  );
  if(!conf)return;

  try{
    showLoading(true,'Cancelando venda e devolvendo estoque...');

    // 1. DEVOLVER ITENS AO ESTOQUE
    const produtosAlterar=[];
    for(const item of (v.itens||[])){
      const prod=db.produtos.find(p=>p.id===item.id);
      if(!prod) continue;
      // Devolver à grade correta
      if(prod.grade&&prod.grade.length>0&&item.tam){
        const g=prod.grade.find(g=>g.n===item.tam||g.n===Number(item.tam));
        if(g) g.q+=item.qtd;
        else prod.grade.push({n:Number(item.tam),q:item.qtd});
        prod.qtd=prod.grade.reduce((s,g)=>s+g.q,0);
      } else {
        prod.qtd=(prod.qtd||0)+item.qtd;
      }
      produtosAlterar.push(prod);
    }

    // 2. SALVAR ESTOQUE NO BANCO
    for(const p of produtosAlterar){
      await sbPatch('produtos','id=eq.'+p.id,{grade:p.grade,qtd:p.qtd});
    }

    // 3. EXCLUIR MOVIMENTOS FINANCEIROS VINCULADOS
    const mvs=db.movimentos.filter(m=>m.vendaId===id);
    for(const m of mvs){
      await sbDelete('movimentos','id=eq.'+m.id);
    }
    db.movimentos=db.movimentos.filter(m=>m.vendaId!==id);

    // 4. EXCLUIR A VENDA
    await sbDelete('vendas','id=eq.'+id);
    db.vendas=db.vendas.filter(x=>x.id!==id);

    saveLocal();
    showLoading(false);
    registrarAudit('VENDA_CANCELADA','Venda '+id+' cancelada — '+fmt(v.total));
    notify('Venda '+id+' cancelada! '+produtosAlterar.length+' produto(s) devolvido(s) ao estoque.');
    filtHist();
  }catch(e){
    showLoading(false);
    notify('Erro ao cancelar: '+e.message,'err');
    console.error('excluirVenda error:',e);
  }
}

let _filtHistTimer=null;
function debounceFiltHist(){clearTimeout(_filtHistTimer);_filtHistTimer=setTimeout(filtHist,280);}
function filtHist(){
  const q=(document.getElementById('hs')?.value||'').toLowerCase();
  const ini=document.getElementById('hi')?.value;
  const fim=document.getElementById('hf')?.value;
  let fil=[...db.vendas].sort((a,b)=>{const na=parseInt((a.id||'').replace(/\D/g,''))||0,nb=parseInt((b.id||'').replace(/\D/g,''))||0;return nb-na;});
  if(q)fil=fil.filter(v=>[v.id,v.clienteNome,v.vendedor,v.pgto,v.modalidade].join(' ').toLowerCase().includes(q));
  if(ini)fil=fil.filter(v=>v.data&&v.data.slice(0,10)>=ini);
  if(fim)fil=fil.filter(v=>v.data&&v.data.slice(0,10)<=fim);
  const tb=document.getElementById('htb');if(tb)tb.innerHTML=genLinhasHist(fil);
}

  saveMovimento(obj).then(()=>{closeM('mmov');renderFin();notify('Registrado!');}).catch(e=>{notify('Erro: '+e.message,'err');});

function delMov(id){
  if(!confirm('Remover?'))return;

function pgUsuarios(){
  if(!isAdmin()){notify('Acesso restrito','err');return;}
  document.getElementById('tbar-actions').innerHTML=`<button class="btn primary" onclick="openUserM()">+ Novo Usuário</button>`;
  renderUsers();
}
function renderUsers(){
  document.getElementById('page').innerHTML=`
  <div class="card"><div class="table-wrap"><table>
    <thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Cadastro</th><th></th></tr></thead>
    <tbody>${db.usuarios.map(u=>`<tr>
      <td class="td-name">${u.nome}</td>
      <td class="text-dim">${u.username}</td>
      <td><span class="badge ${u.role==='admin'?'admin':'wine'}">${u.role==='admin'?'🔑 Admin':'🛍 Vendedor'}</span></td>
      <td><span class="badge ${u.ativo?'green':'red'}">${u.ativo?'Ativo':'Inativo'}</span></td>
      <td class="text-xs text-dim">${fmtDs(u.criado)}</td>
      <td><div class="flex gap-2"><button class="btn xs" onclick="openUserM('${u.id}')">✏️ Editar</button>${u.id!==ses.usuario.id?`<button class="btn xs danger" onclick="delUser('${u.id}')">🗑</button>`:''}</div></td>
    </tr>`).join('')}
    </tbody>
  </table></div></div>

  <div class="modal-backdrop hidden" id="musr">
    <div class="modal modal-sm">
      <div class="modal-header"><div class="modal-title" id="mustit">Novo Usuário</div><button class="modal-close" onclick="closeM('musr')">×</button></div>
      <div class="form-group"><label class="form-label">Nome Completo *</label><input class="form-control" id="un" placeholder="Nome"></div>
      <div class="form-group"><label class="form-label">Usuário (login) *</label><input class="form-control" id="uu" placeholder="Ex: maria.vendas"></div>
      <div class="form-group"><label class="form-label">Senha</label><input class="form-control" type="password" id="us" placeholder="Deixe em branco para manter"></div>
      <div class="form-group"><label class="form-label">Perfil</label><select class="form-control" id="ur" onchange="togglePermEditor()"><option value="vendedor">🛍 Vendedor</option><option value="admin">🔑 Administrador</option></select></div>
      <div class="form-group"><label class="form-label">Status</label><select class="form-control" id="uativo"><option value="true">Ativo</option><option value="false">Inativo</option></select></div>
      <div id="perm-editor" style="display:none;margin-bottom:12px">
        <div class="sep"></div>
        <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:10px">Permissões de Acesso</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px" id="perm-checks"></div>
      </div>
      <div class="modal-footer"><button class="btn" onclick="closeM('musr')">Cancelar</button><button class="btn primary" onclick="salvarUser()">💾 Salvar</button></div>
    </div>
  </div>`;
}
function togglePermEditor(){
  const role = document.getElementById('ur')?.value;
  const ed = document.getElementById('perm-editor');
  if(!ed) return;
  if(role === 'vendedor'){
    ed.style.display = 'block';
    const checks = document.getElementById('perm-checks');
    if(!checks) return;
    const LABELS = {
      dashboard:'Painel',venda:'Nova Venda',estoque:'Estoque',
      clientes:'Clientes',historico:'Vendas (histórico)',caixa:'Fechamento Caixa',
      ranking:'Ranking',vendedores:'Comissões',financeiro:'Financeiro',
      relatorios:'Relatórios',trocas:'Trocas',aniversariantes:'Aniversariantes',cancelar_venda:'Cancelar Vendas'
    };
    const editU = editId ? db.usuarios.find(x=>x.id===editId) : null;
    const perms = editU?.permissoes || PERM_DEFAULTS.vendedor;
    checks.innerHTML = Object.entries(LABELS).map(([k,lb])=>
      `<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:4px 0">
        <input type="checkbox" data-perm="${k}" ${perms[k]?'checked':''} style="width:15px;height:15px;accent-color:var(--accent)">
        ${lb}
      </label>`
    ).join('');
  } else {
    ed.style.display = 'none';
  }
}

function openUserM(id){
  editId=id||null;const u=id?db.usuarios.find(x=>x.id===id):null;
  if(!document.getElementById('musr')) renderUsers();
  setTimeout(()=>{
    document.getElementById('mustit').textContent=u?'Editar Usuário':'Novo Usuário';
    if(u){
      document.getElementById('un').value=u.nome;
      document.getElementById('uu').value=u.username;
      document.getElementById('us').value='';
      document.getElementById('ur').value=u.role;
      document.getElementById('uativo').value=String(u.ativo);
    }
    togglePermEditor();
    openM('musr');
  },30);
}
function salvarUser(){
  const nome=document.getElementById('un').value.trim();
  const username=document.getElementById('uu').value.trim().toLowerCase().replace(/\s+/g,'.');
  const senha=document.getElementById('us').value;
  if(!nome){notify('Informe o nome','warn');return;}
  if(!username){notify('Informe o usuário','warn');return;}
  if(!editId&&!senha){notify('Informe a senha','warn');return;}
  if(senha&&senha.length<4){notify('Mínimo 4 caracteres','warn');return;}
  if(db.usuarios.find(x=>x.username===username&&x.id!==editId)){notify('Usuário já existe','err');return;}
  const existente=editId?db.usuarios.find(x=>x.id===editId):null;
  const role=document.getElementById('ur').value;
  let permissoes=existente?.permissoes||null;
  if(role==='vendedor'){
    permissoes={};
    document.querySelectorAll('#perm-checks input[data-perm]').forEach(el=>{
      permissoes[el.dataset.perm]=el.checked?1:0;
    });
  }
  const obj={
    id:editId||null,nome,username,
    senha:senha||null,
    role,
    ativo:document.getElementById('uativo').value==='true',
    criado:existente?.criado||nowISO(),
    permissoes
  };
  saveUsuario(obj).then(()=>{
    closeM('musr');renderUsers();notify(editId?'Atualizado!':'Usuário criado!');
  }).catch(e=>{notify('Erro: '+e.message,'err');});
}
function delUser(id){
  if(id===ses.usuario.id){notify('Não pode excluir o usuário atual','err');return;}
  if(!confirm('Excluir?'))return;
  deleteUsuario(id).then(()=>{renderUsers();notify('Excluído','warn');}).catch(e=>{notify('Erro: '+e.message,'err');});
}

const RECIBO_DEFAULT={
  presencial:{nomeLoja:'VERSATILE',subLoja:'LOJA DE CALCADOS',endereco:'Palmas - TO',cnpjTel:'CNPJ: 00.000.000/0001-00 | (63) 0000-0000',rodape1:'Obrigado pela preferencia!',rodape2:'- Versatile Loja -',mostrarVendedor:true,mostrarModalidade:true,mostrarWhats:true,mostrarEmail:false,mostrarCPF:true,obsExtra:''},
  online:{nomeLoja:'VERSATILE',subLoja:'LOJA DE CALCADOS - ONLINE',endereco:'Palmas - TO',cnpjTel:'CNPJ: 00.000.000/0001-00 | (63) 0000-0000',rodape1:'Obrigado! Entrega em ate 7 dias uteis.',rodape2:'- Versatile Loja Online -',mostrarVendedor:false,mostrarModalidade:true,mostrarWhats:true,mostrarEmail:true,mostrarCPF:true,obsExtra:'Troca em ate 7 dias com nota fiscal.'}
};
function getReciboConfig(m){
  const k=(m||'').toLowerCase()==='online'?'online':'presencial';
  return Object.assign({},RECIBO_DEFAULT[k],JSON.parse(localStorage.getItem('vrc')||'{}')[k]||{});
}
// carregarConfigsDoSupabase removida — funcionalidade unificada em carregarConfigSupabase
async function saveReciboConfig(k,c){
  // Salva local
  const s=JSON.parse(localStorage.getItem('vrc')||'{}');
  s[k]=c;
  localStorage.setItem('vrc',JSON.stringify(s));
  // Salva no Supabase via upsert (funciona para insert e update)
  await sbUpsertConfig('recibo_'+k, c);
}
function pgRecibos(){document.getElementById('tbar-actions').innerHTML='';renderRecibos();}
function renderRecibos(){
  const cP=getReciboConfig('Presencial'),cO=getReciboConfig('Online');
  document.getElementById('page').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+reEd('presencial','Presencial',cP)+reEd('online','Online',cO)+'</div>';
}
function reEd(k,lb,c){
  const flds=[['nomeLoja','Nome da Loja'],['subLoja','Subtitulo'],['endereco','Endereco'],['cnpjTel','CNPJ/Telefone'],['rodape1','Rodape 1'],['rodape2','Rodape 2']];
  const cks=[['mostrarVendedor','Vendedor'],['mostrarModalidade','Modalidade'],['mostrarCPF','CPF'],['mostrarWhats','WhatsApp'],['mostrarEmail','E-mail']];
  let html='<div class="card"><div class="sec-title">'+(k==='online'?'Recibo Online':'Recibo Presencial')+'</div>';
  flds.forEach(function(x){html+='<div class="form-group"><label class="form-label">'+x[1]+'</label><input class="form-control" id="rc-'+k+'-'+x[0]+'" value="'+(c[x[0]]||'').replace(/"/g,'&quot;')+'"></div>';});
  html+='<div class="form-group"><label class="form-label">Observacoes</label><textarea class="form-control" id="rc-'+k+'-obsExtra" rows="2">'+(c.obsExtra||'')+'</textarea></div>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px">';
  cks.forEach(function(x){html+='<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer"><input type="checkbox" id="rc-'+k+'-'+x[0]+'" '+(c[x[0]]?'checked':'')+' style="accent-color:var(--accent)"> '+x[1]+'</label>';});
  html+='</div><button class="btn primary w-full" data-rkey="'+k+'" onclick="salvarReciboConfig(this.dataset.rkey)">Salvar Modelo '+lb+'</button></div>';
  return html;
}
async function salvarReciboConfig(k){
  const g=f=>{const el=document.getElementById('rc-'+k+'-'+f);return el?(el.type==='checkbox'?el.checked:el.value):'';};
  const btn=document.querySelector('[data-rkey="'+k+'"]');
  if(btn){btn.textContent='Salvando...';btn.disabled=true;}
  await saveReciboConfig(k,{nomeLoja:g('nomeLoja'),subLoja:g('subLoja'),endereco:g('endereco'),cnpjTel:g('cnpjTel'),rodape1:g('rodape1'),rodape2:g('rodape2'),obsExtra:g('obsExtra'),mostrarVendedor:g('mostrarVendedor'),mostrarModalidade:g('mostrarModalidade'),mostrarCPF:g('mostrarCPF'),mostrarWhats:g('mostrarWhats'),mostrarEmail:g('mostrarEmail')});
  if(btn){btn.textContent='✓ Salvo!';setTimeout(()=>{btn.textContent='Salvar Modelo '+(k==='online'?'Online':'Presencial');btn.disabled=false;},2000);}
  notify('Modelo '+(k==='online'?'Online':'Presencial')+' salvo em todos os dispositivos!');
}
